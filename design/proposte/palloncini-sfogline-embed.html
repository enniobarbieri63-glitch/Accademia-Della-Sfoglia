<!-- ======================================================================
     PALLONCINI SFOGLINE — Accademia della Sfoglia
     Da incollare nel sito dove servono i palloncini.
     Non serve nessuna libreria: solo questo blocco.

     Opzioni (attributi del div qui sotto):
       data-numero      quanti palloncini            (default 18)
       data-velocita    1 = normale, 0.5 = lenti     (default 1)
       data-dimensione  1 = normale, 1.4 = piu grandi(default 1)
       data-filo        "si" | "no"                  (default si)
       data-puntatore   "si" | "no" scansa col mouse (default si)
       data-opacita     da 0 a 1                     (default 1)
       data-strato      "pagina"  = sfondo fisso di tutta la pagina
                        "sezione" = riempie il riquadro che lo contiene
                                    (default pagina)
       data-livello     z-index dello strato         (default -1 su pagina)

     FOTO VERE al posto dei volti disegnati — due modi, si possono unire:
       1) data-foto="/foto/rina.jpg, /foto/lucia.jpg, /foto/anna.jpg"
       2) mettere dei <img> dentro al div (comodo con un CMS):
          <div data-palloncini-sfogline><img src="/foto/rina.jpg" alt=""></div>
          le immagini vengono nascoste e usate dentro ai palloncini.
       data-foto-quota  quanta parte dei palloncini usa le foto, da 0 a 1
                        (default 1 = tutti; 0.4 = quattro su dieci, gli altri
                        restano disegnati)
     Le foto rendono meglio se sono quadrate, con il viso al centro,
     circa 500-800 px di lato. Vengono ritagliate a cerchio.

     SUONO (nel div qui sotto e' acceso. Parte al primo tocco del
     visitatore: i browser non lasciano suonare una pagina prima. Metti
     "no" se preferisci il silenzio, e lascia sempre un modo per spegnerlo)
       data-suono        "si" = risatine e "tuc" sintetizzati al volo,
                         senza scaricare nessun file; "no" = muto
       data-suono-file   "/audio/risate.mp3" = una registrazione vera in
                         sottofondo, ripetuta all'infinito
       data-suono-volume da 0 a 1 (default 0.35)
       data-suono-modo   "ogni-tanto" (default) fa partire la registrazione
                         a intervalli di 8-20 secondi, come risate che
                         scappano ogni tanto; "anello" la ripete senza sosta
                         (adatta solo a un sottofondo d ambiente)
       data-voci         "si" = ogni tanto un palloncino dice una frase.
                         La voce e' costruita qui dentro, suono per suono,
                         quindi e' la stessa su ogni apparecchio: niente
                         voci di sistema, niente file da scaricare
       data-voci-frasi   le frasi, separate da |. Le vocali ripetute si
                         allungano cantando: "bellooooo", "tuuuuu"
                         (default "guarda come volo|ohhh che bellooooo|
                         vieni anche tuuuuu|su dai vieni che ci
                         divertiamooooo|evviva laccademia della sfoglia|evviva la sfoglia|che bella sfoglia")
     Per dare al visitatore un interruttore, metti un tuo bottone e chiama:
       <button onclick="PalloncinISfogline.suono(true)">Accendi il suono</button>
       <button onclick="PalloncinISfogline.suono(false)">Silenzio</button>
       <button onclick="PalloncinISfogline.voci(false)">Basta vocine</button>
     ====================================================================== -->

<div data-palloncini-sfogline
     data-numero="18"
     data-velocita="1"
     data-dimensione="1"
     data-filo="si"
     data-puntatore="si"
     data-opacita="1"
     data-strato="pagina"
     data-foto=""
     data-foto-quota="1"
     data-suono="si"
     data-suono-file=""
     data-suono-volume="0.35"
     data-suono-modo="ogni-tanto"
     data-voci="no"
     aria-hidden="true"></div>

<script>
(function () {
  "use strict";

/* ---------- casualità ripetibile ---------- */
  function seme(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function tra(r, a, b) { return a + r() * (b - a); }
  function scegli(r, arr) { return arr[Math.floor(r() * arr.length) % arr.length]; }

  /* ---------- palette dei palloncini ---------- */
  var TINTE = [
    { corpo: "#F5E7D0", luce: "#FFFAF0", bordo: "#C7A87F" }, /* farina      */
    { corpo: "#F1BE9C", luce: "#FDDFC9", bordo: "#B26B49" }, /* albicocca   */
    { corpo: "#EFCF8A", luce: "#FBEDC8", bordo: "#B58F31" }, /* oro         */
    { corpo: "#E49582", luce: "#F6C6B8", bordo: "#A44F38" }, /* terracotta  */
    { corpo: "#CBD4B8", luce: "#E8EEDA", bordo: "#82906A" }, /* salvia      */
    { corpo: "#D08161", luce: "#EDB295", bordo: "#8E4526" }  /* mattone     */
  ];
  var FAZZOLETTI = ["#A93B27", "#D9A227", "#6E7F5B", "#8A2F1F", "#C2603C", "#B8843A"];
  var CAPELLI = ["#6B4A2E", "#3A2A1E", "#8A6B49", "#B9A48D", "#A9602E"];
  var INCHIOSTRO = "#38281C";

  function scurisci(hex, q) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round((n >> 16 & 255) * (1 - q));
    var g = Math.round((n >> 8 & 255) * (1 - q));
    var b = Math.round((n & 255) * (1 - q));
    return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
  }

  /* ---------- il volto della sfoglina ---------- */
  function disegnaVolto(r, id, conFilo) {
    var t = scegli(r, TINTE);
    var fazz = scegli(r, FAZZOLETTI);
    var cap = scegli(r, CAPELLI);
    var conFazzoletto = r() < 0.72;
    var occhiali = r() < 0.3;
    var orecchini = r() < 0.45;
    var farina = r() < 0.55;
    var rughe = r() < 0.35;
    var occhi = scegli(r, ["aperti", "aperti", "aperti", "chiusi", "occhiolino"]);
    var bocca = scegli(r, ["sorriso", "sorriso", "risata", "denti", "o"]);
    var pois = fazz !== "#FAF5EC" && r() < 0.5;
    var s = [];

    s.push('<svg viewBox="0 0 100 152" xmlns="http://www.w3.org/2000/svg">');
    s.push('<defs>');
    s.push('<radialGradient id="g' + id + '" cx="34%" cy="26%" r="82%">');
    s.push('<stop offset="0" stop-color="' + t.luce + '"/><stop offset="1" stop-color="' + t.corpo + '"/>');
    s.push('</radialGradient>');
    s.push('<clipPath id="c' + id + '"><circle cx="50" cy="50" r="44"/></clipPath>');
    s.push('</defs>');

    /* filo e nodo */
    if (conFilo) {
      s.push('<path d="M50 99c7 8-7 13 0 21s-6 13 1 21" fill="none" stroke="' + t.bordo + '" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>');
    }
    s.push('<path d="M45.4 91h9.2l-4.6 9z" fill="' + t.bordo + '"/>');

    /* corpo */
    s.push('<circle cx="50" cy="50" r="44" fill="url(#g' + id + ')"/>');

    /* capelli e fazzoletto, ritagliati nel corpo */
    s.push('<g clip-path="url(#c' + id + ')">');
    if (conFazzoletto) {
      /* ciocche che scappano da sotto il fazzoletto */
      s.push('<g fill="none" stroke="' + cap + '" stroke-width="3" stroke-linecap="round">');
      s.push('<path d="M12 30q-3 10 3 16"/><path d="M88 30q3 10-3 16"/><path d="M28 35q-3 5 0 9"/><path d="M72 35q3 5 0 9"/>');
      s.push('</g>');
      /* fazzoletto */
      s.push('<path d="M0 24q50 22 100 0V0H0z" fill="' + fazz + '"/>');
      if (pois) {
        s.push('<g fill="#FAF5EC" opacity=".8"><circle cx="26" cy="12" r="1.7"/><circle cx="44" cy="17" r="1.7"/><circle cx="62" cy="15" r="1.7"/><circle cx="78" cy="8" r="1.7"/><circle cx="35" cy="3" r="1.7"/></g>');
      }
      s.push('<path d="M0 24q50 22 100 0" fill="none" stroke="' + INCHIOSTRO + '" stroke-width="1.3" opacity=".4"/>');
      /* nodo annodato di lato, con le due punte */
      var ombra = scurisci(fazz, 0.26);
      s.push('<g fill="' + fazz + '" stroke="' + ombra + '" stroke-width="1.1" stroke-linejoin="round">');
      s.push('<path d="M50 13 38 9l3 10z"/><path d="M50 13 62 9l-3 10z"/>');
      s.push('<ellipse cx="50" cy="12.5" rx="5.4" ry="4.4"/>');
      s.push('</g>');
    } else {
      /* pettinatura con riga in mezzo e crocchia */
      s.push('<g fill="none" stroke="' + cap + '" stroke-width="3.2" stroke-linecap="round">');
      s.push('<path d="M9 34q-3 14 3 24"/><path d="M91 34q3 14-3 24"/>');
      s.push('</g>');
      s.push('<path d="M0 26C12 41 22 41 33 31 44 21 56 41 67 35 78 29 90 37 100 26V0H0z" fill="' + cap + '"/>');
      s.push('<ellipse cx="50" cy="2" rx="14" ry="10" fill="' + cap + '"/>');
      s.push('<path d="M63 12l13 4" fill="none" stroke="#D9A227" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>');
    }
    s.push('</g>');

    /* guance */
    s.push('<g fill="#C9603F" opacity=".32"><ellipse cx="31" cy="61" rx="7" ry="4.2"/><ellipse cx="69" cy="61" rx="7" ry="4.2"/></g>');

    /* sopracciglia */
    s.push('<g fill="none" stroke="' + INCHIOSTRO + '" stroke-width="1.7" stroke-linecap="round" opacity=".8">');
    s.push('<path d="M32 41q7-4 13-1"/><path d="M68 41q-7-4-13-1"/>');
    s.push('</g>');

    /* occhi */
    if (occhi === "chiusi") {
      s.push('<g fill="none" stroke="' + INCHIOSTRO + '" stroke-width="2.1" stroke-linecap="round"><path d="M33 52q6-6 12 0"/><path d="M55 52q6-6 12 0"/></g>');
    } else if (occhi === "occhiolino") {
      s.push('<g fill="none" stroke="' + INCHIOSTRO + '" stroke-width="2.1" stroke-linecap="round"><path d="M33 52q6-6 12 0"/></g>');
      s.push('<ellipse cx="61" cy="51" rx="3.2" ry="3.7" fill="' + INCHIOSTRO + '"/><circle cx="62.3" cy="49.7" r="1" fill="#FFFDF7"/>');
    } else {
      s.push('<g fill="' + INCHIOSTRO + '"><ellipse cx="39" cy="51" rx="3.2" ry="3.7"/><ellipse cx="61" cy="51" rx="3.2" ry="3.7"/></g>');
      s.push('<g fill="#FFFDF7"><circle cx="40.3" cy="49.7" r="1"/><circle cx="62.3" cy="49.7" r="1"/></g>');
    }

    if (rughe) {
      s.push('<g fill="none" stroke="' + INCHIOSTRO + '" stroke-width="1.1" stroke-linecap="round" opacity=".45">');
      s.push('<path d="M29 48l-4-2M29 53l-4 1M71 48l4-2M71 53l4 1"/>');
      s.push('</g>');
    }

    /* naso */
    s.push('<path d="M49 55q3.4 2.6 1 4.6" fill="none" stroke="' + INCHIOSTRO + '" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>');

    /* bocca */
    if (bocca === "risata") {
      s.push('<path d="M40 64q10 11 20 0z" fill="#8A2F1F"/><path d="M40 64q10 11 20 0" fill="none" stroke="' + INCHIOSTRO + '" stroke-width="1.5" stroke-linejoin="round"/>');
    } else if (bocca === "denti") {
      s.push('<path d="M40 64q10 10 20 0z" fill="#8A2F1F"/><path d="M42.5 64.6h15q-1.6 3.4-7.5 3.4t-7.5-3.4z" fill="#FFFBF2"/><path d="M40 64q10 10 20 0" fill="none" stroke="' + INCHIOSTRO + '" stroke-width="1.5" stroke-linejoin="round"/>');
    } else if (bocca === "o") {
      s.push('<ellipse cx="50" cy="66" rx="3.4" ry="4.2" fill="#8A2F1F"/>');
    } else {
      s.push('<path d="M41 64q9 7.5 18 0" fill="none" stroke="' + INCHIOSTRO + '" stroke-width="2" stroke-linecap="round"/>');
    }

    if (occhiali) {
      s.push('<g fill="#FFFFFF" fill-opacity=".16" stroke="' + INCHIOSTRO + '" stroke-width="1.5">');
      s.push('<circle cx="39" cy="51" r="8.4"/><circle cx="61" cy="51" r="8.4"/>');
      s.push('<path d="M47.6 51h4.8M30.8 48.6l-6-3.2M69.2 48.6l6-3.2" fill="none" stroke-linecap="round"/>');
      s.push('</g>');
    }

    if (farina) {
      s.push('<g fill="#FFFDF6" opacity=".9"><circle cx="27" cy="72" r="1.3"/><circle cx="34" cy="77" r="0.9"/><circle cx="70" cy="74" r="1.1"/><circle cx="63" cy="79" r="0.8"/><circle cx="50" cy="80" r="1"/></g>');
    }

    /* contorno del palloncino e riflesso */
    s.push('<circle cx="50" cy="50" r="44" fill="none" stroke="' + t.bordo + '" stroke-width="1.4" opacity=".85"/>');
    s.push('<ellipse cx="32" cy="25" rx="13" ry="8" fill="#FFFFFF" opacity=".3" transform="rotate(-28 32 25)"/>');

    if (orecchini) {
      s.push('<g fill="#D9A227" stroke="#8A6516" stroke-width=".7"><circle cx="7.6" cy="60" r="2.7"/><circle cx="92.4" cy="60" r="2.7"/></g>');
    }

    s.push('</svg>');
    return s.join("");
  }

  /* ---------- palloncino con la foto vera ---------- */
  function testo(x) {
    return String(x).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function disegnaFoto(r, id, conFilo, url) {
    var t = scegli(r, TINTE);
    var u = testo(url);
    var s = [];
    s.push('<svg viewBox="0 0 100 152" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">');
    s.push('<defs>');
    s.push('<clipPath id="c' + id + '"><circle cx="50" cy="50" r="44"/></clipPath>');
    s.push('<radialGradient id="v' + id + '" cx="50%" cy="44%" r="58%">');
    s.push('<stop offset=".7" stop-color="' + t.bordo + '" stop-opacity="0"/><stop offset="1" stop-color="' + t.bordo + '" stop-opacity=".5"/>');
    s.push('</radialGradient>');
    s.push('</defs>');
    if (conFilo) {
      s.push('<path d="M50 99c7 8-7 13 0 21s-6 13 1 21" fill="none" stroke="' + t.bordo + '" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>');
    }
    s.push('<path d="M45.4 91h9.2l-4.6 9z" fill="' + t.bordo + '"/>');
    s.push('<circle cx="50" cy="50" r="44" fill="' + t.corpo + '"/>');
    s.push('<image href="' + u + '" xlink:href="' + u + '" x="6" y="6" width="88" height="88" preserveAspectRatio="xMidYMid slice" clip-path="url(#c' + id + ')"/>');
    s.push('<circle cx="50" cy="50" r="44" fill="url(#v' + id + ')"/>');
    s.push('<circle cx="50" cy="50" r="44" fill="none" stroke="' + t.bordo + '" stroke-width="2.2" opacity=".9"/>');
    s.push('<ellipse cx="32" cy="25" rx="13" ry="8" fill="#FFFFFF" opacity=".24" transform="rotate(-28 32 25)"/>');
    s.push('</svg>');
    return s.join("");
  }

  /* ---------- suono: risatine e tuc sintetizzati, oppure un file vero ---------- */
  function creaSuono(opz) {
    var ctx = null, master = null, fiato = null, risate = [], traccia = null, acceso = false, vociAccese = false;
    var prossimaVoce = 0, parlaFinoA = 0, prossimoFile = Infinity;
    var ultimoTuc = 0, ultimaRisata = 0, prossimaRisata = 0;

   function apri() {
      if (ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.9 * opz.volume / 0.35;
      var caldo = ctx.createBiquadFilter();
      caldo.type = "lowpass";
      caldo.frequency.value = 6200;

      /* un filo di stanza intorno alle voci */
      var coda = ctx.createConvolver();
      var lung = Math.floor(ctx.sampleRate * 0.5);
      var imp = ctx.createBuffer(2, lung, ctx.sampleRate);
      for (var c = 0; c < 2; c++) {
        var dati = imp.getChannelData(c);
        for (var i = 0; i < lung; i++) {
          dati[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / lung, 2.6);
        }
      }
      coda.buffer = imp;
      var quantaCoda = ctx.createGain();
      quantaCoda.gain.value = 0.22;

      master.connect(caldo);
      caldo.connect(ctx.destination);
      caldo.connect(coda);
      coda.connect(quantaCoda);
      quantaCoda.connect(ctx.destination);

      /* fiato: un secondo di rumore, riusato per tutte le risate */
      fiato = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      var f = fiato.getChannelData(0);
      for (var j = 0; j < f.length; j++) f[j] = Math.random() * 2 - 1;

      preparaRisate();
    }

   /* il "tuc" morbido del palloncino che tocca il bordo */
    function tuc(tono, forza) {
      var t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(tono, t);
      o.frequency.exponentialRampToValueAtTime(tono * 0.5, t + 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.1 * forza, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.16);
    }

    /* La risatina: sintesi della voce campione per campione.
       Ogni bambina ha il suo tratto vocale e il suo tono; dentro alla
       risata la voce cambia grana (ora spinta, ora soffiata), qualche
       sillaba passa dal naso, il tono non sta mai fermo e alla fine si
       sente il respiro che rientra. Le raffiche si costruiscono una
       volta sola, all accensione del suono, e poi si suonano. */
    function gauss() {
      return (Math.random() + Math.random() + Math.random() + Math.random() - 2) / 1.2;
    }

    function costruisciRisata(par) {
      var sr = ctx.sampleRate;
      var n = Math.ceil(sr * 2.4);
      var buf = ctx.createBuffer(1, n, sr);
      var out = buf.getChannelData(0);
      var sorgente = new Float32Array(n);
      var apertura = new Float32Array(n);
      var nasale = new Float32Array(n);
      var i, j, t = 0.05;
      var sillabe = 3 + Math.floor(Math.random() * 3);

      for (var s = 0; s < sillabe; s++) {
        var ultima = s === sillabe - 1;
        var f0s = par.f0 * Math.pow(0.95, s) * (1 + gauss() * 0.025);
        var amp = (s === 0 ? 1 : Math.max(0.4, 1 - s * 0.13)) * (0.85 + Math.random() * 0.3);
        var aria = par.fiato * (1 + s * 0.26);
        var OQ = 0.5 + Math.random() * 0.28 + s * 0.03;    /* quanto restano aperte le corde */
        var tilt = 0.55 - OQ * 0.35;
        var conNaso = Math.random() < 0.4;
        var duro = Math.random() < 0.35;                   /* colpo di glottide invece della "h" */
        var attacco = duro ? 0.025 : 0.07;
        var lunga = 0.15 * (0.8 + Math.random() * 0.45);
        var i0 = Math.floor(t * sr), len = Math.floor(lunga * sr);
        var fase = 0, periodo = 0, nn = 0, deriva = 0, lpf = 0;

        for (i = 0; i < len; i++) {
          var u = i / len;
          if (i % 220 === 0) deriva = deriva * 0.85 + gauss() * 0.012;
          var f0 = f0s * (1 + 0.1 * Math.sin(Math.PI * Math.min(1, u * 1.5)) - 0.24 * u + deriva);
          if (ultima && u > 0.55) f0 *= 0.82;
          var busta = u < attacco ? u / attacco : Math.pow(1 - (u - attacco) / (1 - attacco), 1.75);
          if (fase <= 0) {
            var doppio = ultima && u > 0.6 && Math.random() < 0.45;   /* il gracchio finale */
            periodo = sr / f0 * (doppio ? 2 : 1) * (1 + gauss() * 0.03);
            fase = periodo;
            nn = 0;
          }
          var T1 = periodo * OQ * 0.72, T2 = periodo * OQ * 0.28, g = 0;
          if (nn < T1) g = 0.5 * (1 - Math.cos(Math.PI * nn / T1));
          else if (nn < T1 + T2) g = Math.cos(Math.PI * (nn - T1) / (2 * T2));
          var aperta = nn < T1 + T2 ? 1 : 0.22;
          var soffio = (Math.random() * 2 - 1) * aria * aperta * (u < 0.14 ? (duro ? 0.8 : 2.8) : 1);
          var grezzo = g * (1 + gauss() * 0.06) + soffio;
          lpf += (grezzo - lpf) * (0.25 + tilt);
          if (i0 + i < n) {
            sorgente[i0 + i] += lpf * busta * amp;
            apertura[i0 + i] = Math.max(0.05, 1 - u * 0.85);
            nasale[i0 + i] = conNaso ? Math.min(1, u * 1.4) : 0;
          }
          nn++;
          fase--;
        }

        var gap = Math.floor(0.032 * sr);
        for (i = 0; i < gap && i0 + len + i < n; i++) {
          sorgente[i0 + len + i] += (Math.random() * 2 - 1) * aria * 0.55 * (1 - i / gap);
          apertura[i0 + len + i] = 0.2;
        }
        t += 0.19 * (0.8 + Math.random() * 0.4);
      }

      /* il respiro che rientra, con un filo di voce dentro */
      var ir = Math.floor((t + 0.03) * sr), lr = Math.floor(0.32 * sr);
      var fase2 = 0, nn2 = 0;
      for (i = 0; i < lr && ir + i < n; i++) {
        var uu = i / lr, invil = Math.sin(Math.PI * uu);
        var v = (Math.random() * 2 - 1) * par.fiato * 2.4 * invil * 0.6;
        if (fase2 <= 0) { fase2 = sr / (230 + 150 * uu); nn2 = 0; }
        var Tr = fase2 * 0.4;
        if (nn2 < Tr) v += 0.5 * (1 - Math.cos(Math.PI * nn2 / Tr)) * 0.12 * invil;
        nn2++;
        fase2--;
        sorgente[ir + i] += v;
        apertura[ir + i] = 0.3 + 0.35 * uu;
      }

      /* bocca, gola e naso: formanti mobili, scalati sulla statura di chi ride */
      var poli = [{y1:0,y2:0},{y1:0,y2:0},{y1:0,y2:0},{y1:0,y2:0},{y1:0,y2:0}];
      var a1 = [], a2 = [], A = [], gn = 0, rz = 0.96, thz = 0, zx1 = 0, zx2 = 0, prec = 0;
      for (i = 0; i < n; i++) {
        if (i % 64 === 0) {
          var ap = apertura[i], k = par.tratto;
          var F = [(560 + 400 * ap) * k, (1560 + 260 * ap) * k, 2950 * k, 3900 * k, 1000 * k];
          var B = [100 + 40 * (1 - ap), 140, 190, 260, 120];
          a1 = []; a2 = []; A = [];
          for (j = 0; j < 5; j++) {

        var x = sorgente[i];
        if (gn > 0) {

        } else {

        for (j = 0; j < 4; j++) {

          f.y2 = f.y1; f.y1 = y; orale = y;
        }
        var nas = 0;
        if (gn > 0) {

          f.y2 = f.y1; f.y1 = nas;
        }
        var somma = orale + nas * gn * 0.6;

      var picco = 0;
      for (i = 0; i < n; i++) picco = Math.max(picco, Math.abs(out[i]));

    }

    /* tre bambine diverse, due risate a testa */
    var BIMBE = [
      { f0: 400, tratto: 1.00, fiato: 0.16 },
      { f0: 452, tratto: 1.07, fiato: 0.20 },
      { f0: 366, tratto: 0.94, fiato: 0.15 }
    ];

    function preparaRisate() {
      if (risate.length) return;
      for (var g = 0; g < 2; g++) {
        for (var i = 0; i < BIMBE.length; i++) risate.push(costruisciRisata(BIMBE[i]));

    function risatina(tono) {
      if (!risate.length) return;
      var b = risate[Math.floor(Math.random() * risate.length)];
      var src = ctx.createBufferSource();
      src.buffer = b;
      src.playbackRate.value = Math.max(0.9, Math.min(1.14, tono / 400));
      var g = ctx.createGain();
      g.gain.value = 0.5 + Math.random() * 0.2;

      g.connect(master);

    }

    /* La vocina che parla. Dalle lettere ai suoni con le regole
       dell italiano, dai suoni alle formanti che scivolano senza scatti.
       Il tono e' una linea sola: sale sull accento, scende alla fine, e
       le vocali ripetute si allungano cantando ("bellooooo").
       Nessuna voce di sistema: suona uguale su ogni apparecchio. */
    var SUONI = {
      a:{F:[950,1550,3000,3900],t:"voc",d:0.115},
      e:{F:[600,2150,2950,3800],t:"voc",d:0.110},
      E:{F:[720,1900,2900,3800],t:"voc",d:0.115},
      i:{F:[380,2900,3400,4200],t:"voc",d:0.100},
      o:{F:[570,1000,2750,3700],t:"voc",d:0.110},
      O:{F:[700,1150,2800,3700],t:"voc",d:0.115},
      u:{F:[370,880,2650,3600],t:"voc",d:0.100},
      j:{F:[350,2950,3400,4200],t:"sem",d:0.055},
      w:{F:[350,800,2600,3600],t:"sem",d:0.055},
      m:{F:[300,1100,2300,3300],t:"nas",d:0.070},
      n:{F:[300,1650,2700,3400],t:"nas",d:0.070},
      N:{F:[300,2100,2900,3500],t:"nas",d:0.080},
      l:{F:[400,1400,2900,3800],t:"liq",d:0.060},
      L:{F:[280,2650,3300,4000],t:"liq",d:0.105},
      r:{F:[500,1400,2700,3600],t:"tap",d:0.045},
      v:{F:[350,1200,2400,3400],t:"fri",d:0.070,rumore:0.10,banda:[1400,1.2]},
      f:{F:[350,1200,2400,3400],t:"fri",d:0.090,rumore:0.19,banda:[1800,1.0],sordo:1},
      s:{F:[350,1800,2600,3600],t:"fri",d:0.100,rumore:0.26,banda:[5200,2.4],sordo:1},
      z:{F:[350,1800,2600,3600],t:"fri",d:0.080,rumore:0.14,banda:[5000,2.4]},
      S:{F:[350,2000,2700,3600],t:"fri",d:0.100,rumore:0.22,banda:[3000,1.6],sordo:1},
      p:{F:[400,900,2400,3500],t:"occ",d:0.060,scoppio:[800,0.9],sordo:1},
      b:{F:[350,900,2400,3500],t:"occ",d:0.055,scoppio:[800,0.7]},
      t:{F:[400,1700,2700,3600],t:"occ",d:0.060,scoppio:[3600,0.9],sordo:1},
      d:{F:[350,1700,2700,3600],t:"occ",d:0.055,scoppio:[2800,0.7]},
      k:{F:[400,1900,2500,3500],t:"occ",d:0.062,scoppio:[2100,0.9],sordo:1},
      g:{F:[350,1900,2500,3500],t:"occ",d:0.055,scoppio:[1900,0.7]},
      C:{F:[350,2000,2700,3600],t:"aff",d:0.085,scoppio:[2900,0.85],rumore:0.2,banda:[3000,1.6],sordo:1},
      G:{F:[350,2000,2700,3600],t:"aff",d:0.080,scoppio:[2600,0.7],rumore:0.14,banda:[2800,1.6]},
      " ":{F:[500,1500,2700,3600],t:"pausa",d:0.075}
    };

    function eVocale(c) { return "aeiouàèéìòóù".indexOf(c) >= 0; }

    function leggi(testo) {
      var s = testo.toLowerCase().replace(/[^a-zàèéìòóù ]/g, "");
      var out = [], i = 0;
      while (i < s.length) {
        var c = s.charAt(i), d = s.charAt(i + 1), e = s.charAt(i + 2), f = null, salta = 1;
        if (c === "c" && d === "h") { f = "k"; salta = 2; }
        else if (c === "c" && (d === "i" || d === "e")) { f = "C"; salta = (d === "i" && eVocale(e)) ? 2 : 1; }
        else if (c === "c") f = "k";
        else if (c === "g" && d === "h") { f = "g"; salta = 2; }
        else if (c === "g" && d === "n") { f = "N"; salta = 2; }
        else if (c === "g" && d === "l" && e === "i") {
          out.push({ p: "L" });                 /* la gl di "sfoglia" */
          f = "j";                              /* col guizzo che la fa sentire */
          salta = 3;
        }
        else if (c === "g" && (d === "i" || d === "e")) { f = "G"; salta = (d === "i" && eVocale(e)) ? 2 : 1; }
        else if (c === "g") f = "g";
        else if (c === "s" && d === "c" && (e === "i" || e === "e")) { f = "S"; salta = (e === "i" && eVocale(s.charAt(i + 3))) ? 3 : 2; }
        else if (c === "q") { out.push({ p: "k" }); f = "w"; salta = 2; }
        else if (c === "h") {
          var quante = 0;
          while (s.charAt(i + quante) === "h") quante++;
          var ultimo = out[out.length - 1];
          if (ultimo && SUONI[ultimo.p] && SUONI[ultimo.p].t === "voc") ultimo.lunga = Math.max(ultimo.lunga || 1, quante + 1);
          i += quante;
          continue;
        }
        else if (c === "z") { out.push({ p: "t" }); f = "s"; }
        else if (c === "à") f = "a";
        else if (c === "è") f = "E";
        else if (c === "é") f = "e";
        else if (c === "ì") f = "i";
        else if (c === "ò") f = "O";
        else if (c === "ó") f = "o";
        else if (c === "ù") f = "u";
        else if (SUONI[c]) f = c;
        if (!f) { i += salta; continue; }
        if (eVocale(c)) {
          var n = 1;
          while (s.charAt(i + n) === c) n++;
          out.push(n > 1 ? { p: f, lunga: n } : { p: f });
          i += n;
          continue;
        }
        if (s.charAt(i + salta) === c) { out.push({ p: f, doppia: true }); i += salta + 1; continue; }
        out.push({ p: f });
        i += salta;
      }
      /* i e u davanti a vocale diventano semivocali: vieni, guarda */
      for (var k = 0; k < out.length - 1; k++) {
        var q = out[k], dopo = out[k + 1];
        if (q.lunga || !dopo || !SUONI[dopo.p] || SUONI[dopo.p].t !== "voc") continue;

        else if (q.p === "u") q.p = "w";
      }
      return out;
    }

    /* Il cuore: bersagli interpolati.
       Ogni suono ha il suo punto d arrivo, piazzato al centro della sua
       durata; fra un centro e l altro formanti, voce e apertura scivolano
       con una curva morbida. Nessun gradino da smussare dopo: il gesto
       nasce continuo, come la bocca che si muove davvero.
       Le occlusive e le fricative si aggiungono sopra come eventi, con le
       loro rampe, senza spezzare la linea. */
    function costruisciFrase(testo, vc) {
      var sr = ctx.sampleRate;
      var seq = leggi(testo);
      if (!seq.length) return null;

      var i, j, k;

      /* accento sulla penultima vocale di ogni parola */
      var parola = [];
      for (k = 0; k <= seq.length; k++) {
        var x = seq[k];
        if (!x || x.p === " ") {
          var voc = [];
          for (j = 0; j < parola.length; j++) if (SUONI[parola[j].p].t === "voc") voc.push(parola[j]);
          if (voc.length) voc[Math.max(0, voc.length - 2)].accento = true;
          parola = [];
        } else parola.push(x);
      }

      /* durate e centri */
      var respiro = 0.12;
      var segs = [], t = respiro;
      for (k = 0; k < seq.length; k++) {
        var su = SUONI[seq[k].p], d = su.d;
        if (seq[k].lunga) d = 0.16 + 0.12 * Math.min(5, seq[k].lunga);
        else if (su.t === "voc") d *= seq[k].accento ? 1.45 : 0.92;
        else if (su.t === "pausa") d = 0.05;
        else d *= 0.86;
        if (seq[k].doppia) d *= 1.7;
        d *= vc.ritmo;
        segs.push({
          s: su, d: d, inizio: t, centro: t + d / 2,
          accento: !!seq[k].accento, lunga: seq[k].lunga || 0
        });
        t += d;
      }
      var fine = t, totale = t + 0.3;
      var n = Math.ceil(sr * totale);
      var buf = ctx.createBuffer(1, n, sr);
      var out = buf.getChannelData(0);

      /* coarticolazione: la consonante prende meta' del colore della
         vocale accanto, poi l interpolazione fa il resto */
      for (k = 0; k < segs.length; k++) {
        var tk = segs[k].s.t;
        var F = [segs[k].s.F[0], segs[k].s.F[1], segs[k].s.F[2], segs[k].s.F[3]];
        if (tk !== "voc" && tk !== "sem" && tk !== "pausa") {
          var vic = null;
          for (j = k + 1; j < segs.length && !vic; j++) {
            if (segs[j].s.t === "pausa") break;
            if (segs[j].s.t === "voc") vic = segs[j].s;
          }
          for (j = k - 1; j >= 0 && !vic; j--) {
            if (segs[j].s.t === "pausa") break;
            if (segs[j].s.t === "voc") vic = segs[j].s;
          }
          if (vic) { F[1] = F[1] * 0.5 + vic.F[1] * 0.5; F[2] = F[2] * 0.5 + vic.F[2] * 0.5; }
        }
        segs[k].bF = F;
        /* quanto suona e quanto e' aperta la bocca, al centro del suono */
        if (tk === "voc") { segs[k].amp = segs[k].accento ? 1 : 0.86; segs[k].voz = 1; segs[k].nas = 0; }
        else if (tk === "sem") { segs[k].amp = 0.8; segs[k].voz = 1; segs[k].nas = 0; }
        else if (tk === "nas") { segs[k].amp = 0.6; segs[k].voz = 1; segs[k].nas = 1; }
        else if (tk === "liq") { segs[k].amp = 0.72; segs[k].voz = 1; segs[k].nas = 0; }
        else if (tk === "tap") { segs[k].amp = 0.5; segs[k].voz = 1; segs[k].nas = 0; }
        else if (tk === "fri") { segs[k].amp = segs[k].s.sordo ? 0.12 : 0.45; segs[k].voz = segs[k].s.sordo ? 0.1 : 1; segs[k].nas = 0; }
        else if (tk === "pausa") { segs[k].amp = 0.12; segs[k].voz = 0.5; segs[k].nas = 0; }
        else { segs[k].amp = 0.3; segs[k].voz = segs[k].s.sordo ? 0.15 : 0.8; segs[k].nas = 0; }
      }

      var F1 = new Float32Array(n), F2 = new Float32Array(n), F3 = new Float32Array(n), F4 = new Float32Array(n);
      var amp = new Float32Array(n), voz = new Float32Array(n), nas = new Float32Array(n);
      var rum = new Float32Array(n), bF = new Float32Array(n), bQ = new Float32Array(n);
      var tono = new Float32Array(n);

      /* --- le tracce: interpolazione morbida fra i centri --- */
      var kk = 0;
      for (i = 0; i < n; i++) {
        var tempo = i / sr;
        while (kk < segs.length - 1 && tempo > segs[kk + 1].centro) kk++;
        var a = segs[kk], b = segs[Math.min(kk + 1, segs.length - 1)];
        var u;
        if (tempo <= segs[0].centro) { a = b = segs[0]; u = 0; }
        else if (tempo >= segs[segs.length - 1].centro) { a = b = segs[segs.length - 1]; u = 0; }
        else u = (tempo - a.centro) / Math.max(1e-6, b.centro - a.centro);
        var w = 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, u)));
        F1[i] = (a.bF[0] + (b.bF[0] - a.bF[0]) * w) * vc.tratto;
        F2[i] = (a.bF[1] + (b.bF[1] - a.bF[1]) * w) * vc.tratto;
        F3[i] = (a.bF[2] + (b.bF[2] - a.bF[2]) * w) * vc.tratto;
        F4[i] = (a.bF[3] + (b.bF[3] - a.bF[3]) * w) * vc.tratto;
        amp[i] = a.amp + (b.amp - a.amp) * w;
        voz[i] = a.voz + (b.voz - a.voz) * w;
        nas[i] = a.nas + (b.nas - a.nas) * w;
      }

      /* --- la linea del tono: una curva sola per tutta la frase --- */
      var esclama = /evviva|ohh/.test(testo.toLowerCase());
      var partenza = esclama ? 1.1 : 1.05, calo = esclama ? 0.28 : 0.22;
      for (i = 0; i < n; i++) {
        var uf = Math.min(1, (i / sr) / Math.max(0.2, fine));
        tono[i] = vc.f0 * (partenza - calo * uf);
      }
      for (k = 0; k < segs.length; k++) {
        var sg = segs[k];
        if (!sg.accento && !sg.lunga) continue;
        var largo = sg.lunga ? sg.d * 0.9 : Math.max(0.16, sg.d * 1.6);
        var quanto = sg.lunga ? (esclama ? 0.16 : 0.13) : (esclama ? 0.15 : 0.09);
        var c0 = Math.floor((sg.centro - largo / 2) * sr), len = Math.floor(largo * sr);
        for (i = 0; i < len; i++) {
          var idx = c0 + i;
          if (idx < 0 || idx >= n) continue;
          var uc = i / len;
          /* gobba a coseno: sale e scende senza spigoli */
          tono[idx] *= 1 + quanto * (0.5 - 0.5 * Math.cos(2 * Math.PI * uc));
        }
      }

      /* --- eventi sopra la linea: chiusure, scoppi, fruscii --- */

      for (k = 0; k < segs.length; k++) {
        var sg2 = segs[k], tp = sg2.s.t;
        var i0 = Math.floor(sg2.inizio * sr), len2 = Math.max(1, Math.floor(sg2.d * sr));
        if (tp === "occ" || tp === "aff") {
          var chiusa = tp === "occ" ? 0.7 : 0.45;
          var fondo = sg2.s.sordo ? 0.04 : 0.2;
          var iC = Math.floor(len2 * chiusa);
          var ramp = Math.max(1, Math.min(Math.floor(0.020 * sr), Math.floor(iC / 2)));
          for (i = 0; i < iC; i++) {
            var idx2 = i0 + i;
            if (idx2 < 0 || idx2 >= n) continue;
            /* aperto = 1, chiuso = 0: la bocca si chiude e si riapre scorrendo */
            var aperto = 0;
            if (i < ramp) aperto = 1 - (0.5 - 0.5 * Math.cos(Math.PI * (i / ramp)));
            else if (i > iC - ramp) aperto = 1 - (0.5 - 0.5 * Math.cos(Math.PI * ((iC - i) / ramp)));
            amp[idx2] *= fondo + (1 - fondo) * aperto;
            if (sg2.s.sordo) voz[idx2] *= 0.15 + 0.85 * aperto;
          }
          /* lo scoppio */
          var iS = i0 + iC, lenS = Math.floor(0.014 * sr);
          for (i = 0; i < lenS; i++) {
            var idx3 = iS + i;
            if (idx3 < 0 || idx3 >= n) continue;
            var us = i / lenS;
            rum[idx3] += sg2.s.scoppio[1] * Math.pow(1 - us, 2);
            bF[idx3] = sg2.s.scoppio[0];
            bQ[idx3] = 1.4;
          }
          if (tp === "aff") {
            var iA = iS + lenS, lenA = Math.floor(len2 * 0.4);
            for (i = 0; i < lenA; i++) {
              var idx4 = iA + i;
              if (idx4 < 0 || idx4 >= n) continue;
              rum[idx4] += sg2.s.rumore * Math.sin(Math.PI * Math.min(1, i / lenA + 0.1));
              bF[idx4] = sg2.s.banda[0];
              bQ[idx4] = sg2.s.banda[1];
            }
          }
        } else if (tp === "fri") {
          for (i = 0; i < len2; i++) {
            var idx5 = i0 + i;
            if (idx5 < 0 || idx5 >= n) continue;
            var uu = i / len2;
            rum[idx5] += sg2.s.rumore * Math.sin(Math.PI * Math.min(1, uu * 1.6));
            bF[idx5] = sg2.s.banda[0];
            bQ[idx5] = sg2.s.banda[1];
            if (sg2.s.sordo) {
              var dentro = Math.min(1, Math.min(i, len2 - i) / Math.max(1, 0.02 * sr));
              voz[idx5] *= 1 - 0.88 * dentro;
            }
          }
        }
      }

      /* il fiato prima di parlare e la coda che si spegne */
      var iR = Math.floor(respiro * sr);
      for (i = 0; i < iR && i < n; i++) {
        rum[i] += 0.05 * Math.sin(Math.PI * (i / iR));
        if (!bF[i]) { bF[i] = 1500; bQ[i] = 0.9; }
        amp[i] *= i / iR;
      }
      var iF = Math.floor(fine * sr), lenF = n - iF;
      for (i = 0; i < lenF; i++) {
        var idx6 = iF + i;
        if (idx6 >= n) break;
        amp[idx6] *= Math.max(0, 1 - i / lenF);
      }

      /* una lisciata leggerissima solo dove restano spigoli di eventi */
      function lisc(arr, tau) {
        var aa = Math.exp(-1 / (tau * sr)), y = arr[0];
        for (var q = 0; q < n; q++) { y = aa * y + (1 - aa) * arr[q]; arr[q] = y; }
      }
      lisc(amp, 0.009); lisc(voz, 0.011); lisc(rum, 0.004);
      lisc(amp, 0.004); lisc(voz, 0.004);
      lisc(bF, 0.004); lisc(bQ, 0.004);

      /* --- sintesi --- */
      var poli = [{y1:0,y2:0},{y1:0,y2:0},{y1:0,y2:0},{y1:0,y2:0},{y1:0,y2:0}];
      var banda = { y1: 0, y2: 0 };
      var fase = 0, nn = 0, prec = 0, drift = 0, zx1 = 0, zx2 = 0;
      var a1 = [], a2 = [], A = [], gn = 0, thz = 0, ba1 = 0, ba2 = 0, bA = 0;
      for (i = 0; i < n; i++) {
        if (i % 24 === 0) {
          var Fs = [F1[i], F2[i], F3[i], F4[i], 1000 * vc.tratto];
          var Bs = [115, 155, 205, 280, 130];   /* bocca piccola: risonanze piu larghe */
          a1 = []; a2 = []; A = [];
          for (j = 0; j < 5; j++) {
            var r = Math.exp(-Math.PI * Bs[j] / sr), th = 2 * Math.PI * Math.max(150, Fs[j]) / sr;
            a1.push(2 * r * Math.cos(th)); a2.push(-r * r); A.push(1 - a1[j] - a2[j]);
          }
          gn = nas[i] * 0.6;
          thz = 2 * Math.PI * (820 * vc.tratto) / sr;
          var bf = Math.max(300, bF[i] || 1500), bq = Math.max(0.6, bQ[i] || 1);
          var rr = Math.exp(-Math.PI * (bf / bq) / sr), tt = 2 * Math.PI * bf / sr;
          ba1 = 2 * rr * Math.cos(tt); ba2 = -rr * rr; bA = 1 - ba1 - ba2;
        }
        if (i % 200 === 0) drift = drift * 0.9 + gauss() * 0.005;
        var f0 = tono[i] * (1 + drift + 0.010 * Math.sin(2 * Math.PI * 4.6 * i / sr));
        if (fase <= 0) { fase = sr / f0 * (1 + gauss() * 0.010); nn = 0; }
        var T1 = fase * 0.44, T2 = fase * 0.16, g = 0;
        if (nn < T1) g = 0.5 * (1 - Math.cos(Math.PI * nn / T1));
        else if (nn < T1 + T2) g = Math.cos(Math.PI * (nn - T1) / (2 * T2));
        nn++; fase--;

        var x = (g + (Math.random() * 2 - 1) * 0.03) * voz[i] * amp[i];
        if (gn > 0) {
          var zz = x - 2 * 0.96 * Math.cos(thz) * zx1 + 0.9216 * zx2;
          zx2 = zx1; zx1 = x;
          x = x * (1 - gn) + zz * gn;
        } else { zx2 = zx1; zx1 = x; }
        var orale = x, ff, yy;
        for (j = 0; j < 4; j++) {
          ff = poli[j];
          yy = A[j] * orale + a1[j] * ff.y1 + a2[j] * ff.y2;
          ff.y2 = ff.y1; ff.y1 = yy; orale = yy;
        }
        var nsl = 0;
        if (gn > 0) { ff = poli[4]; nsl = A[4] * x + a1[4] * ff.y1 + a2[4] * ff.y2; ff.y2 = ff.y1; ff.y1 = nsl; }
        var bianco = (Math.random() * 2 - 1) * rum[i];
        var yb = bA * bianco + ba1 * banda.y1 + ba2 * banda.y2;
        banda.y2 = banda.y1; banda.y1 = yb;
        var somma = orale + nsl * gn * 0.6 + yb * 0.9;
        out[i] = somma - 0.96 * prec;
        prec = somma;
      }

      var picco = 0;
      for (i = 0; i < n; i++) picco = Math.max(picco, Math.abs(out[i]));
      if (picco > 0) { var qq = 0.78 / picco; for (i = 0; i < n; i++) out[i] *= qq; }
      return buf;
    }

    var VOCINE = [
      { f0: 430, tratto: 1.22, ritmo: 1.02 },
      { f0: 470, tratto: 1.28, ritmo: 0.98 },
      { f0: 405, tratto: 1.18, ritmo: 1.08 }
    ];
    var fraseFatta = {};

    function voce(frase) {
      if (!ctx) return;
      var vc = VOCINE[Math.floor(Math.random() * VOCINE.length)];
      var chiave = frase + "|" + vc.f0;
      if (!fraseFatta[chiave]) fraseFatta[chiave] = costruisciFrase(frase, vc);
      var b = fraseFatta[chiave];
      if (!b) return;
      var src = ctx.createBufferSource();
      src.buffer = b;
      var g = ctx.createGain();
      g.gain.value = 0.75;
      src.connect(g);
      g.connect(master);
      src.start();
    }

    return {
      attivo: function () { return acceso; },
      accendiVoci: function (si) {
        vociAccese = !!si;
        if (vociAccese) {
          apri();
          if (ctx && ctx.state === "suspended") ctx.resume();
          prossimaVoce = performance.now() + 1500;
        }
      },
      accendi: function (si) {
        acceso = !!si;
        if (acceso) {
          if (opz.sintetico) {
            apri();
            if (ctx && ctx.state === "suspended") ctx.resume();
            prossimaRisata = performance.now() + 800;
          }
          if (opz.file) {
            if (!traccia) {
              traccia = new Audio(opz.file);
              traccia.preload = "auto";
              traccia.loop = opz.modo === "anello";
              traccia.volume = opz.volume;
            }
            if (opz.modo === "anello") {
              var pr = traccia.play();
              if (pr && pr.catch) pr.catch(function () {});
            } else {
              prossimoFile = performance.now() + 1500;
            }
          }
        } else if (traccia) {
          traccia.pause();
        }
      },
      rimbalzo: function (p) {
        if (!acceso || !ctx || document.hidden) return;
        var ora = performance.now();
        if (ora < parlaFinoA) return;        /* silenzio: c'e' una vocina che parla */
        if (ora - ultimoTuc < 240) return;
        ultimoTuc = ora;
        tuc(300 / p.profondita, Math.min(1, p.profondita));
        if (Math.random() < 0.24 && ora - ultimaRisata > 900) {
          ultimaRisata = ora;
          risatina(360 + Math.random() * 90);
        }
      },
      battito: function () {
        var adesso = performance.now();
        /* la registrazione vera: una risata ogni tanto, non un tappeto continuo */
        if (acceso && traccia && opz.modo !== "anello" && !document.hidden && adesso > prossimoFile) {
          prossimoFile = adesso + 8000 + Math.random() * 12000;
          try { traccia.currentTime = 0; } catch (e) {}
          var pf = traccia.play();
          if (pf && pf.catch) pf.catch(function () {});
        }
        if (vociAccese && !document.hidden && adesso > prossimaVoce) {
          prossimaVoce = adesso + 5000 + Math.random() * 6000;
          voce(opz.frasi[Math.floor(Math.random() * opz.frasi.length)]);
        }
        if (!acceso || !ctx || document.hidden) return;
        var ora = performance.now();
        if (ora < prossimaRisata) return;
        prossimaRisata = ora + 1800 + Math.random() * 3200;
        ultimaRisata = ora;
        risatina(360 + Math.random() * 90);
      }
    };
  }

  var scene = [];
  window.PalloncinISfogline = {
    suono: function (si) {
      scene.forEach(function (s) { s.accendi(si); });
    },
    voci: function (si) {
      scene.forEach(function (s) { s.accendiVoci(si); });
    }
  };

  /* ---------- una scena per ogni contenitore ---------- */
  function avvia(nodo) {
    if (nodo.dataset.avviato) return;
    nodo.dataset.avviato = "1";

    var opz = {
      numero: Math.max(1, Math.min(120, parseInt(nodo.dataset.numero, 10) || 18)),
      velocita: parseFloat(nodo.dataset.velocita) || 1,
      dimensione: parseFloat(nodo.dataset.dimensione) || 1,
      filo: nodo.dataset.filo !== "no",
      puntatore: nodo.dataset.puntatore !== "no",
      opacita: nodo.dataset.opacita === undefined ? 1 : parseFloat(nodo.dataset.opacita),
      sezione: nodo.dataset.strato === "sezione",
      foto: [],
      quotaFoto: 0
    };

    /* foto dall'attributo e dalle <img> messe dentro al contenitore */
    (nodo.dataset.foto || "").split(",").forEach(function (u) {
      u = u.trim();
      if (u) opz.foto.push(u);
    });
    Array.prototype.slice.call(nodo.querySelectorAll("img")).forEach(function (im) {
      var u = im.currentSrc || im.getAttribute("src");
      if (u) opz.foto.push(u);
      im.remove();
    });
    if (opz.foto.length) {
      var q = parseFloat(nodo.dataset.fotoQuota);
      opz.quotaFoto = isNaN(q) ? 1 : Math.max(0, Math.min(1, q));
    }

    var vol = parseFloat(nodo.dataset.suonoVolume);
    var frasi = (nodo.dataset.vociFrasi || "guarda come volo|ohhh che bellooooo|vieni anche tuuuuu|su dai vieni che ci divertiamooooo|evviva laccademia della sfoglia|evviva la sfoglia|che bella sfoglia")
      .split("|").map(function (f) { return f.trim(); }).filter(Boolean);
    var suono = creaSuono({
      sintetico: nodo.dataset.suono === "si",
      file: (nodo.dataset.suonoFile || "").trim(),
      volume: isNaN(vol) ? 0.35 : Math.max(0, Math.min(1, vol)),
      modo: nodo.dataset.suonoModo === "anello" ? "anello" : "ogni-tanto",
      frasi: frasi
    });
    scene.push(suono);

    /* i browser lasciano suonare solo dopo il primo gesto del visitatore */
    if (nodo.dataset.suono === "si" || nodo.dataset.voci === "si" || (nodo.dataset.suonoFile || "").trim()) {
      var sveglia = function () {
        if (nodo.dataset.suono === "si" || (nodo.dataset.suonoFile || "").trim()) suono.accendi(true);
        if (nodo.dataset.voci === "si") suono.accendiVoci(true);
        ["pointerdown", "keydown", "touchstart"].forEach(function (e) {
          window.removeEventListener(e, sveglia);
        });
      };
      ["pointerdown", "keydown", "touchstart"].forEach(function (e) {
        window.addEventListener(e, sveglia, { once: false });
      });
    }

    nodo.style.position = opz.sezione ? "absolute" : "fixed";
    nodo.style.top = nodo.style.left = nodo.style.right = nodo.style.bottom = "0";
    nodo.style.overflow = "hidden";
    nodo.style.pointerEvents = "none";
    nodo.style.opacity = String(opz.opacita);
    nodo.style.zIndex = nodo.dataset.livello || (opz.sezione ? "0" : "-1");
    if (opz.sezione) {
      var padre = nodo.parentElement;
      if (padre && getComputedStyle(padre).position === "static") padre.style.position = "relative";
    }

    var palloncini = [];
    var contatore = 0;
    var semeScena = Math.floor(Math.random() * 1e9);
    var L = 0, H = 0;
    var visibile = true;
    var puntatore = { x: -9999, y: -9999, attivo: false };
    var motoRidotto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function misuraScena() {
      var r = nodo.getBoundingClientRect();
      L = r.width || window.innerWidth;
      H = r.height || window.innerHeight;
    }

    function misura(p) {
      var lato = Math.min(L, H);
      p.larghezza = Math.max(46, lato * 0.15 * p.profondita * opz.dimensione);
      p.raggio = p.larghezza * 0.44;
      p.el.style.width = p.larghezza + "px";
    }

    function nuovo(i) {
      var r = seme((semeScena ^ Math.imul(i + 1, 2654435761)) >>> 0);
      r(); r(); r();
      var profondita = 0.55 + Math.random() * 0.6;
      var el = document.createElement("div");
      el.style.position = "absolute";
      el.style.top = el.style.left = "0";
      el.style.transformOrigin = "50% 33.333%";
      el.style.willChange = "transform";
      el.style.filter = "drop-shadow(0 8px 12px rgba(42,31,23,.16))";
      var conFoto = opz.foto.length && r() < opz.quotaFoto;
      el.innerHTML = conFoto
        ? disegnaFoto(r, ++contatore, opz.filo, opz.foto[i % opz.foto.length])
        : disegnaVolto(r, ++contatore, opz.filo);
      el.firstChild.setAttribute("style", "display:block;width:100%;height:auto");
      nodo.appendChild(el);

      var angolo = Math.random() * Math.PI * 2;
      var base = 0.35 + Math.random() * 0.7;
      var p = {
        el: el,
        profondita: profondita,
        larghezza: 0,
        raggio: 0,
        x: (0.08 + Math.random() * 0.84) * L,
        y: (0.08 + Math.random() * 0.84) * H,
        vx: Math.cos(angolo) * base * profondita,
        vy: Math.sin(angolo) * base * profondita,
        fase: Math.random() * Math.PI * 2,
        ondeggio: 3 + Math.random() * 6,
        ritmo: 0.006 + Math.random() * 0.008
      };
      misura(p);
      el.style.zIndex = String(Math.round(profondita * 100));
      return p;
    }

    var ultimo = performance.now();

    function passo(ora) {
      var dt = Math.min(48, ora - ultimo) / 16.6667;
      ultimo = ora;

      if (visibile && !document.hidden) {
        for (var i = 0; i < palloncini.length; i++) {
          var p = palloncini[i];
          var v = opz.velocita * (motoRidotto ? 0.3 : 1);
          p.x += p.vx * dt * v;
          p.y += p.vy * dt * v;

          if (opz.puntatore && puntatore.attivo) {
            var dx = p.x - puntatore.x, dy = p.y - puntatore.y;
            var d2 = dx * dx + dy * dy, R = 170;
            if (d2 < R * R) {
              var d = Math.sqrt(d2) || 1, f = (1 - d / R) * 0.7;
              p.vx += (dx / d) * f;
              p.vy += (dy / d) * f;
            }
          }

          var urto = false;
          if (p.x < p.raggio) { p.x = p.raggio; p.vx = Math.abs(p.vx); p.vy += (Math.random() - 0.5) * 0.12; urto = true; }
          if (p.x > L - p.raggio) { p.x = L - p.raggio; p.vx = -Math.abs(p.vx); p.vy += (Math.random() - 0.5) * 0.12; urto = true; }
          if (p.y < p.raggio) { p.y = p.raggio; p.vy = Math.abs(p.vy); p.vx += (Math.random() - 0.5) * 0.12; urto = true; }
          if (p.y > H - p.raggio) { p.y = H - p.raggio; p.vy = -Math.abs(p.vy); p.vx += (Math.random() - 0.5) * 0.12; urto = true; }
          if (urto) suono.rimbalzo(p);

          var s = Math.hypot(p.vx, p.vy);
          var max = 2.4 * p.profondita, min = 0.22 * p.profondita;
          if (s > max) { p.vx *= max / s; p.vy *= max / s; }
          if (s < min && s > 0) { p.vx *= min / s; p.vy *= min / s; }

          p.fase += p.ritmo * dt * (motoRidotto ? 0.4 : 1);
          var rot = motoRidotto ? 0 : Math.sin(p.fase) * p.ondeggio;
          p.el.style.transform =
            "translate3d(" + (p.x - p.larghezza / 2) + "px," + (p.y - p.larghezza / 2) + "px,0) rotate(" + rot.toFixed(2) + "deg)";
        }
        suono.battito();
      }
      requestAnimationFrame(passo);
    }

    misuraScena();
    for (var i = 0; i < opz.numero; i++) palloncini.push(nuovo(i));

    window.addEventListener("resize", function () {
      misuraScena();
      palloncini.forEach(function (p) {
        misura(p);
        p.x = Math.min(Math.max(p.x, p.raggio), L - p.raggio);
        p.y = Math.min(Math.max(p.y, p.raggio), H - p.raggio);
      });
    });

    if (opz.puntatore) {
      window.addEventListener("pointermove", function (e) {
        var r = nodo.getBoundingClientRect();
        puntatore.x = e.clientX - r.left;
        puntatore.y = e.clientY - r.top;
        puntatore.attivo = true;
      });
      window.addEventListener("pointerleave", function () { puntatore.attivo = false; });
    }

    /* ferma il disegno quando la scena non si vede: niente batteria sprecata */
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (voci) {
        visibile = voci[0].isIntersecting;
      }).observe(nodo);
    }

    requestAnimationFrame(passo);
  }

  function avviaTutti() {
    var nodi = document.querySelectorAll("[data-palloncini-sfogline]");
    for (var i = 0; i < nodi.length; i++) avvia(nodi[i]);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", avviaTutti);
  } else {
    avviaTutti();
  }
})();
</script>
